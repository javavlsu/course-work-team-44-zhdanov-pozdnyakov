spring.application.name=image-builder

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/luckfox_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Рантайм-схему создаёт Hibernate (java_working.sql — документная модель в DOCs).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Имена таблиц — как в @Table (User, Image, Component...). Reserved-word `User`
# квотируется точечно в самой сущности (@Table(name="`User`")).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Security
spring.security.user.name=admin
spring.security.user.password=admin

# File Upload (if needed for SDK files)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Luckfox build orchestration
# Путь к обёртке сборки и каталог для готовых .img.
# По умолчанию относительно рабочего каталога backend (../ = корень репозитория).
luckfox.build.script=${LUCKFOX_BUILD_SCRIPT:../scripts/luckfox_build.sh}
luckfox.build.output-dir=${LUCKFOX_OUTPUT_DIR:../output/images}
luckfox.build.timeout-seconds=${LUCKFOX_BUILD_TIMEOUT:1800}

# Производительность (по итогам нагрузочного тестирования, DEF-12/22/23)
# Ленивые коллекции (components, dependencies) и типы компонентов догружаются пачками
# через IN (...) вместо запроса на каждую строку (N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Соединение с БД не удерживается на время сериализации ответа: все DTO строятся в сервисах.
spring.jpa.open-in-view=false
# Пул соединений: при 16 ядрах 10 соединений становились очередью; при перегрузке —
# быстрый отказ 503 через 3 с вместо ожидания 30 с.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:3000}
# Соединения пула уже без autocommit: Hibernate не шлёт SET autocommit=0/1 вокруг каждой транзакции.
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Защита входа от перебора паролей (DEF-21): после N неудач за окно — 429 без проверки BCrypt.
security.login.max-failures-per-email=5
security.login.max-failures-per-ip=20
security.login.window-seconds=300
